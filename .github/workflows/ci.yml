name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-slice:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6
      - run: python tools/ci-tests.py
