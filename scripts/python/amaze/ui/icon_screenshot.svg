   xmlns:svg="http://www.w3.org/2000/svg"><!-- HIP capture icon (solid picture glyph: framed photo, sun and
       slope cut as negative space), redrawn 2026-08-21. The body is a
       load-time tint target: #5d7abd, the same target the Library gear
       uses, so IconMenuButton tints this identically. No punch-out
       colour any more - the glyph's interior is negative space, and
       state feedback is the button's own chip.

       BARE ARTWORK ONLY, matching icon_library.svg. IconMenuButton
       produces hover and pressed itself (grey chip + tint swap), so an
       icon asset here carries one state, no ids and no hidden
       elements.

       The viewBox stays TIGHTENED to the artwork rather than the
       design canvas, so it renders the same optical size as its
       neighbours in the same 30px button. Measured, not eyeballed -
       see the ink-extent test. --><g
